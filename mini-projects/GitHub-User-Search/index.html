<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="p-[5rem]">

    <input id="searchBar" placeholder="Enter User Id" type="text" class="border bg-pink-200 p-4 text-2xl rounded-md">
    <button id="btn" class="border bg-pink-200 p-4 text-2xl rounded-md">Search</button>



    <div class="mt-5">
        <div class="flex gap-3">
            <div class="h-[5rem] w-[5rem] rounded-full bg-gray-400">
                <img src="" alt="" class="cover rounded-full" id="img">
            </div>
        </div>

        <div class="flex gap-3">
            <label for="name">Name :- </label>
            <p id="name"></p>
        </div>

        <div class="flex gap-3">
            <label for="Followers">Followers :- </label>
            <p id="Followers"></p>
        </div>

        <div class="flex gap-3">
            <label for="Following">Following :- </label>
            <p id="Following"></p>
        </div>

        <div class="flex gap-3">
            <label for="PublicRepos">Public Repos :- </label>
            <p id="PublicRepos"></p>
        </div>


        <div class="flex gap-3">
            <label for="ProfileLink">Profile Link :- </label>
            <p id="ProfileLink"></p>
        </div>





    </div>



    <script src="script.js"></script>
</body>

</html>
