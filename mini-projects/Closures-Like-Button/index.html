<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-pink-100 via-white to-red-100">

    <div class="bg-white rounded-3xl shadow-xl p-10 w-[350px] text-center">

        <div class="text-8xl mb-4">
            ❤️
        </div>

        <h1 class="text-3xl font-bold mb-2">
            Like Button
        </h1>

        <p id="likes" class="text-2xl font-semibold text-gray-700 mb-8">

        </p>

        <button id="likeBtn" class="bg-red-500 hover:bg-red-600 active:scale-95
                   transition-all duration-200
                   text-white text-xl font-semibold
                   px-8 py-4 rounded-2xl shadow-lg">
            ❤️ Like
        </button>

    </div>

    <script src="script.js"></script>
</body>

</html>
