<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="p-[5rem] flex flex-col gap-4">
    <h1 class="text-4xl text-center font-bold">
        Random User Generator
    </h1>
    <div class="flex flex-col jusitfy-start items-center gap-3 mt-10">
        <button id="btn"
            class="w-[450px] px-6 py-3 text-lg font-semibold text-white bg-blue-600 rounded-xl shadow-md hover:bg-blue-700 active:scale-95 transition disabled:bg-gray-400 disabled:cursor-not-allowed">
            Search
        </button>

        <div
            class="w-[10rem] h-[10rem] rounded-full bg-gray-400 shadow-sm outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            <img src="" alt="" id="img" class="cover w-100 rounded-full">
        </div>

        <div
            class="flex gap-3 w-[450px] px-5 py-3 text-lg  rounded-xl shadow-sm outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            <label for="name">Name :- </label>
            <p id="name"></p>
        </div>
        <div
            class="flex gap-3 w-[450px] px-5 py-3 text-lg  rounded-xl shadow-sm outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            <label for="email">Email :- </label>
            <p id="email"></p>
        </div>
        <div
            class="flex gap-3 w-[450px] px-5 py-3 text-lg  rounded-xl shadow-sm outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            <label for="country">Country :- </label>
            <p id="country"></p>
        </div>
        <div
            class="flex gap-3 w-[450px] px-5 py-3 text-lg  rounded-xl shadow-sm outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition">
            <label for="phone">Phone :- </label>
            <p id="phone"></p>
        </div>




    </div>

    <script src="script.js"></script>
</body>

</html>
